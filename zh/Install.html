<h1>安装</h1>
<p>Python 3.7+。运行时只依赖 NumPy。</p>
<pre><code class="language-bash">pip install pymeteo-kit
</code></pre>
<pre><code class="language-python">import pymeteo as pm
</code></pre>
<p>PyPI 上的名字是 <code>pymeteo-kit</code>，导入名是 <code>pymeteo</code>。</p>
<p>从仓库安装：</p>
<pre><code class="language-bash">pip install -e &quot;.[dev]&quot;
pytest
</code></pre>
