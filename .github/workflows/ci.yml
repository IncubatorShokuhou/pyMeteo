name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest

  # GitHub-hosted ubuntu-20.04 and actions/setup-python 3.6 were removed in 2025.
  # Runtime support is still 3.6+; this job installs the hatchling wheel (built
  # on 3.12) into the last official CPython 3.6 image. hatchling itself needs
  # 3.8+, so 3.6 cannot pip-install from sdist / editable.
  test-py36:
    name: test (3.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Tests on CPython 3.6
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            python:3.6.15-buster \
            bash -c 'python -m pip install "pip<22" && python -m pip install dist/*.whl "pytest>=6.2.5,<7" "importlib-metadata>=1.4,<4.9" && python -m pytest'
