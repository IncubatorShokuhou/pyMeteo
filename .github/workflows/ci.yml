name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev,mcp]"
      - name: Tests
        run: pytest

  # hatchling needs 3.8+; 3.7 is tested from the wheel built above.
  # setup-python has no 3.7 build for ubuntu-24.04 (ubuntu-latest).
  test-py37:
    name: test (3.7)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Tests on CPython 3.7
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            python:3.7.17-bullseye \
            bash -c 'python -m pip install dist/*.whl "pytest>=7.0,<8" "importlib-metadata>=1.4" && python -m pytest'
