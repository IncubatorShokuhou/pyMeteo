[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymeteo-kit"
dynamic = ["version"]
description = "Lightweight meteorological diagnostic functions with explicit string unit parameters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.7"
authors = [{ name = "IncubatorShokuhou" }]
keywords = [
    "meteorology",
    "atmosphere",
    "sounding",
    "diagnostics",
    "thermodynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.20,<1.22; python_version < '3.8'",
    "numpy>=1.21,<1.25; python_version >= '3.8' and python_version < '3.9'",
    "numpy>=1.21,<2.1; python_version >= '3.9' and python_version < '3.10'",
    "numpy>=1.21.3; python_version >= '3.10' and python_version < '3.11'",
    "numpy>=1.23.2; python_version >= '3.11' and python_version < '3.12'",
    "numpy>=1.26; python_version >= '3.12' and python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8; python_version < '3.8'",
    "pytest>=7.0; python_version >= '3.8'",
    "importlib-metadata>=1.4; python_version < '3.8'",
    "ruff>=0.4; python_version >= '3.8'",
]
mcp = [
    "mcp>=1.0; python_version >= '3.10'",
]

[project.scripts]
pymeteo = "pymeteo.cli:main"

[project.urls]
Homepage = "https://github.com/IncubatorShokuhou/pyMeteo"
Repository = "https://github.com/IncubatorShokuhou/pyMeteo"
Issues = "https://github.com/IncubatorShokuhou/pyMeteo/issues"
Documentation = "https://incubatorshokuhou.github.io/pyMeteo/"
Wiki = "https://github.com/IncubatorShokuhou/pyMeteo/wiki"

[tool.hatch.version]
path = "src/pymeteo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymeteo"]

[tool.hatch.build.targets.wheel.force-include]
"src/pymeteo/skills/meteo_expert" = "pymeteo/skills/meteo_expert"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/README_zh.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py37"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
