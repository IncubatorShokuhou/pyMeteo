[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-meteo"
dynamic = ["version"]
description = "Lightweight meteorological diagnostic functions with explicit string unit parameters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "IncubatorShokuhou" }]
keywords = [
    "meteorology",
    "atmosphere",
    "sounding",
    "diagnostics",
    "thermodynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/IncubatorShokuhou/pyMeteo"
Repository = "https://github.com/IncubatorShokuhou/pyMeteo"
Issues = "https://github.com/IncubatorShokuhou/pyMeteo/issues"
Documentation = "https://github.com/IncubatorShokuhou/pyMeteo/blob/master/README_zh.md"

[tool.hatch.version]
path = "src/pymeteo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymeteo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/README_zh.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
